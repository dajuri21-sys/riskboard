<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISKBOARD v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* ── 리셋 & 변수 ── */
:root {
  --bg0: #060a0f; --bg1: #0c1018; --bg2: #101620; --bg3: #141c26;
  --border: #1a2b3c; --border2: #253d54;
  --text: #d0d8e4; --text2: #8b96a8; --text3: #46566a;
  --green: #34d058; --green-bg: rgba(52,208,88,.10);
  --red: #f85149;   --red-bg:   rgba(248,81,73,.10);
  --amber: #f0b429; --amber-bg: rgba(240,180,41,.08);
  --blue: #58a6ff;  --blue-bg:  rgba(88,166,255,.08);
  --accent: #1c6ef3;
  --mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
  --sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 11px; --radius-sm: 7px;
  --shadow: 0 4px 28px rgba(0,0,0,.45);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans); background: var(--bg0); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  font-size: 14px; line-height: 1.6;
  font-feature-settings: 'kern' 1, 'liga' 1;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  word-break: keep-all;          /* 한글 단어 분리 방지 */
  overflow-wrap: break-word;
}
/* 배경 격자 */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(88,166,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(88,166,255,.025) 1px, transparent 1px);
  background-size: 40px 40px;
}
body::after {
  content: ''; position: fixed; top: -150px; left: 50%; transform: translateX(-50%);
  width: 700px; height: 300px; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse, rgba(88,166,255,.05) 0%, transparent 70%);
}
/* ── 레이아웃 ── */
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 24px 20px 80px; }
/* ── 헤더 ── */
.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 18px;
  animation: fadeDown .4s ease both;
}
.hdr-left { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 40px; height: 40px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--blue));
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  box-shadow: 0 0 20px rgba(88,166,255,.25);
}
.hdr-title { font-family: 'Bebas Neue', var(--sans); font-size: 30px; letter-spacing: .08em; color: #fff; font-weight: 400; }
.hdr-title small { font-family: var(--mono); font-size: 11px; color: var(--blue); margin-left: 8px; font-weight: 400; }
.hdr-right { display: flex; align-items: center; gap: 10px; }
.hdr-clock { font-family: var(--mono); font-size: 12px; color: var(--text2); letter-spacing: .02em; font-weight: 500; }
.dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 7px var(--green); animation: pulse 2s infinite; }
/* ── 탭 ── */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tab {
  background: transparent; border: none; border-bottom: 2px solid transparent;
  color: var(--text3); font-family: var(--sans); font-size: 13px; font-weight: 600;
  padding: 9px 18px; cursor: pointer; transition: all .18s; margin-bottom: -1px; letter-spacing: .02em;
}
.tab:hover { color: var(--text2); }
.tab.on { color: var(--blue); border-bottom-color: var(--blue); }
/* ── 메트릭 ── */
.metrics {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
  margin-bottom: 14px; animation: fadeUp .4s .05s ease both;
}
.metric {
  background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; transition: border-color .2s, transform .15s;
}
.metric:hover { border-color: var(--border2); transform: translateY(-1px); }
.metric-label { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
.metric-val { font-family: var(--mono); font-size: 15px; font-weight: 600; color: #fff; letter-spacing: -.02em; }
.metric-sub { font-family: var(--mono); font-size: 11px; color: var(--text2); margin-top: 3px; }
/* ── 섹터 요약 ── */
.sector-bar {
  background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; margin-bottom: 12px;
  animation: fadeUp .4s .08s ease both;
}
.sector-bar-title { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
.sector-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sector-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 5px;
  padding: 4px 10px; font-size: 12px;
}
.sc-name { color: var(--text); font-weight: 500; }
.sc-pct  { font-family: var(--mono); color: var(--blue); font-size: 11px; }
.sc-pnl  { font-family: var(--mono); font-size: 11px; }
/* ── 예산 ── */
.budget-bar-wrap {
  background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 12px; animation: fadeUp .4s .1s ease both;
}
.budget-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.budget-label { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; }
.budget-nums { display: flex; gap: 16px; flex-wrap: wrap; }
.bnum { font-family: var(--mono); font-size: 12px; color: var(--text2); }
.bnum span { color: #fff; font-weight: 600; }
.bar-bg { height: 5px; border-radius: 3px; background: var(--bg3); border: 1px solid var(--border); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width .6s cubic-bezier(.4,0,.2,1); }
/* ── 패널 (추가폼) ── */
.panel {
  background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; margin-bottom: 18px; animation: fadeUp .4s .12s ease both;
}
.panel-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.panel-icon { width: 24px; height: 24px; border-radius: 5px; background: var(--blue-bg); display: flex; align-items: center; justify-content: center; font-size: 13px; }
.panel-title { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: .14em; text-transform: uppercase; }
/* ── 폼 ── */
label { font-size: 10px; font-weight: 600; color: var(--text3); display: block; margin-bottom: 4px; letter-spacing: .07em; text-transform: uppercase; }
input, select, textarea {
  width: 100%; background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-family: var(--sans); font-size: 13.5px;
  color: var(--text); transition: border-color .18s, box-shadow .18s;
}
input, select { height: 38px; padding: 0 11px; }
textarea { padding: 9px 11px; resize: vertical; }
input[type=number] { -moz-appearance: textfield; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
input[type=date] { padding: 0 9px; color-scheme: dark; }
select { cursor: pointer; }
input::placeholder, textarea::placeholder { color: var(--text3); }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(31,111,235,.15);
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.grid-5 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
/* ── 버튼 ── */
.btn {
  height: 38px; padding: 0 14px; border: 1px solid var(--border2);
  border-radius: var(--radius-sm); background: var(--bg2); color: var(--text);
  font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .16s;
  white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
}
.btn:hover { background: var(--border); color: #fff; }
.btn:disabled { opacity: .3; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; height: 42px; font-size: 14px; width: 100%; letter-spacing: .04em; }
.btn-primary:hover { background: var(--blue); border-color: var(--blue); }
.btn-sm { height: 28px; padding: 0 9px; font-size: 12px; border-radius: 5px; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text2); }
.btn-ghost:hover { background: var(--bg2); color: #fff; border-color: var(--border); }
.btn-danger { background: transparent; border-color: transparent; color: var(--text3); }
.btn-danger:hover { background: var(--red-bg); color: var(--red); }
.btn-sell { background: var(--blue-bg); border-color: rgba(88,166,255,.3); color: var(--blue); font-weight: 600; }
.btn-sell:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
/* ── 자동갱신 배지 ── */
.auto-badge {
  font-family: var(--mono); font-size: 11px; padding: 3px 9px;
  border-radius: 10px; border: 1px solid var(--border); color: var(--text3);
  cursor: pointer; transition: all .2s; user-select: none;
}
.auto-badge.on { color: var(--green); border-color: rgba(63,185,80,.4); background: var(--green-bg); }
/* ── 칩 ── */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 4px 11px; border-radius: 20px; font-family: var(--mono); }
.chip-ok   { background: var(--green-bg); color: var(--green); border: 1px solid rgba(63,185,80,.3); }
.chip-err  { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(248,81,73,.3); }
.chip-load { background: var(--bg2);      color: var(--text2); border: 1px solid var(--border); }
.spin { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--border2); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
.hint-box { background: rgba(227,179,65,.06); border: 1px solid rgba(227,179,65,.2); border-radius: var(--radius-sm); padding: 10px 13px; font-size: 12px; color: var(--amber); line-height: 1.7; margin-top: 8px; display: none; }
/* ── 툴바 ── */
.toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
.toolbar-l, .toolbar-r { display: flex; align-items: center; gap: 8px; }
.sort-sel { height: 30px; padding: 0 9px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text2); font-size: 12px; cursor: pointer; width: auto; }
/* ── 카드 ── */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; transition: border-color .18s, transform .14s, box-shadow .18s;
  animation: fadeUp .35s ease both;
}
.card:hover { border-color: var(--border2); transform: translateY(-1px); box-shadow: var(--shadow); }
.card-stripe { height: 3px; }
.stripe-safe   { background: linear-gradient(90deg, var(--green), transparent); }
.stripe-warn   { background: linear-gradient(90deg, var(--amber), transparent); }
.stripe-danger { background: linear-gradient(90deg, var(--red),   transparent); }
.stripe-take   { background: linear-gradient(90deg, var(--blue),  transparent); }
.card-body { padding: 13px 16px 14px; }
/* 카드 헤더 */
.card-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 11px; }
.card-name-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.card-name { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
.naver-btn { font-size: 10px; color: var(--text3); text-decoration: none; padding: 2px 6px; border: 1px solid var(--border); border-radius: 3px; font-family: var(--mono); transition: all .14s; }
.naver-btn:hover { color: var(--blue); border-color: var(--blue); }
.badge-sector { font-size: 10px; color: var(--blue); background: var(--blue-bg); border: 1px solid rgba(88,166,255,.22); border-radius: 3px; padding: 2px 6px; font-weight: 600; }
.badge-days  { font-family: var(--mono); font-size: 10px; color: var(--text2); background: var(--bg2); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; }
.badge-target{ font-family: var(--mono); font-size: 10px; color: var(--amber); background: var(--amber-bg); border: 1px solid rgba(227,179,65,.25); border-radius: 3px; padding: 2px 6px; }
.badge-fail  { font-family: var(--mono); font-size: 10px; color: var(--amber); }
.card-meta   { font-family: var(--mono); font-size: 10px; color: var(--text3); margin-top: 2px; }
.card-btns   { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
/* 상태 배지 */
.status-badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 3px; letter-spacing: .06em; text-transform: uppercase; font-family: var(--mono); }
.st-safe   { background: var(--green-bg); color: var(--green); border: 1px solid rgba(63,185,80,.25); }
.st-warn   { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(227,179,65,.25); }
.st-danger { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(248,81,73,.25); }
.st-take   { background: var(--blue-bg);  color: var(--blue);  border: 1px solid rgba(88,166,255,.25); }
/* 실현 손익 박스 */
.realize-box { background: rgba(248,81,73,.05); border: 1px solid rgba(248,81,73,.18); border-radius: var(--radius-sm); padding: 9px 12px; margin-bottom: 10px; }
.realize-title { font-size: 10px; font-weight: 700; color: var(--red); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 7px; }
.realize-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ri { font-family: var(--mono); font-size: 11px; color: var(--text2); }
.ri strong { display: block; font-size: 13px; margin-top: 2px; }
/* 분할매수 */
.batches { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 10px; }
.batches-title { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 7px; }
.batch-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 7px; }
.batch-row { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 12px; }
.bn { color: var(--text3); width: 16px; flex-shrink: 0; }
.bd { color: var(--text3); min-width: 78px; }
.bp { color: #fff; font-weight: 600; min-width: 78px; }
.bq { color: var(--text2); min-width: 48px; }
.bpct { min-width: 58px; font-weight: 600; }
.batch-del-btn { background: transparent; border: none; color: var(--text3); cursor: pointer; font-size: 10px; padding: 2px 4px; border-radius: 3px; }
.batch-del-btn:hover { color: var(--red); background: var(--red-bg); }
.batch-add { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.batch-inp { height: 30px; font-size: 12px; flex: 1; min-width: 75px; }
/* 수치 그리드 */
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 10px; }
.num { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; transition: border-color .14s; }
.num:hover { border-color: var(--border2); }
.num-label { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .09em; text-transform: uppercase; margin-bottom: 4px; }
.num-val   { font-family: var(--mono); font-size: 13px; font-weight: 600; color: #fff; letter-spacing: -.02em; }
.num-val .u { font-size: 10px; font-weight: 400; color: var(--text3); }
.num-sub   { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-top: 2px; }
.col-green { color: var(--green); } .col-red { color: var(--red); } .col-amber { color: var(--amber); }
/* 수정 폼 */
.edit-form { display: none; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; }
.edit-title { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
.edit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 10px; }
.edit-grid input, .edit-grid select { height: 32px; font-size: 12px; background: var(--bg1); }
/* 메모 */
.memo-area { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 11px; margin-bottom: 10px; cursor: pointer; transition: border-color .14s; }
.memo-area:hover { border-color: var(--border2); }
.memo-lbl { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .09em; text-transform: uppercase; margin-bottom: 3px; }
.memo-txt { font-size: 12px; color: var(--text2); white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
.memo-ph  { font-size: 12px; color: var(--text3); font-style: italic; }
.memo-edit { display: none; margin-bottom: 10px; }
/* 프로그레스 */
.prog { margin-top: 3px; }
.prog-bg { height: 4px; border-radius: 2px; background: rgba(255,255,255,.04); overflow: hidden; }
.prog-fill { height: 100%; border-radius: 2px; transition: width .55s cubic-bezier(.4,0,.2,1); }
.prog-lbls { display: flex; justify-content: space-between; margin-top: 4px; }
.prog-lbl  { font-family: var(--mono); font-size: 10px; color: var(--text3); }
/* ── 알림 ── */
.alerts { margin-bottom: 14px; }
.alert { display: flex; align-items: center; gap: 9px; border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 7px; font-size: 13px; font-weight: 500; border-left: 3px solid; animation: slideIn .25s ease both; }
.alert-danger { background: var(--red-bg);  border-color: var(--red);  color: var(--red); }
.alert-take   { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
/* ── 매도 모달 ── */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 1000; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: var(--bg1); border: 1px solid var(--border2); border-radius: 14px; padding: 26px; width: 420px; max-width: 94vw; animation: fadeUp .25s ease; }
.modal-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 3px; }
.modal-sub   { font-size: 12px; color: var(--text3); margin-bottom: 18px; }
.modal-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 11px; }
.modal-grid input { height: 36px; font-size: 13px; }
.modal-preview { font-family: var(--mono); font-size: 13px; background: var(--bg2); border-radius: var(--radius-sm); padding: 9px; margin-bottom: 14px; min-height: 36px; line-height: 1.7; }
.modal-btns { display: flex; gap: 8px; }
/* ── 매도 기록 탭 ── */
.trade-summary { background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
.trade-card { background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 9px; }
.trade-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; }
.trade-name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
.trade-meta { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-top: 2px; }
.trade-pnl  { font-family: var(--mono); font-size: 14px; font-weight: 700; text-align: right; line-height: 1.4; }
.trade-detail { display: flex; gap: 11px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--text2); }
.trade-note { color: var(--text3); font-style: italic; }
/* ── 차트 탭 ── */
.chart-box { background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.chart-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cstat { background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; text-align: center; }
.cstat-lbl { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 7px; }
.cstat-val { font-family: var(--mono); font-size: 15px; font-weight: 700; color: #fff; }
/* ── 토스트 ── */
.toast { position: fixed; bottom: 24px; right: 24px; background: #1a2636; border: 1px solid var(--border2); border-radius: var(--radius); padding: 11px 16px; font-size: 13px; color: var(--text); box-shadow: var(--shadow); z-index: 9999; max-width: 320px; line-height: 1.5; animation: toastIn .25s ease both; }
.toast.err { border-color: rgba(248,81,73,.5); }
/* ── 빈 상태 ── */
.empty { text-align: center; padding: 3.5rem 0; background: var(--bg1); border: 1px dashed var(--border); border-radius: var(--radius); }
.empty-icon { font-size: 38px; margin-bottom: 10px; opacity: .2; }
.empty-txt  { font-size: 13px; color: var(--text3); line-height: 1.8; }
/* ── 애니메이션 ── */
@keyframes fadeUp   { from { transform: translateY(10px); opacity: 0; } to { opacity: 1; transform: none; } }
@keyframes fadeDown { from { transform: translateY(-7px); opacity: 0; } to { opacity: 1; transform: none; } }
@keyframes slideIn  { from { transform: translateX(-8px); opacity: 0; } }
@keyframes toastIn  { from { transform: translateY(16px); opacity: 0; } }
@keyframes toastOut { to   { transform: translateY(16px); opacity: 0; } }
@keyframes spin     { to   { transform: rotate(360deg); } }
@keyframes pulse    { 0%,100%{opacity:1}50%{opacity:.3} }
/* ── 반응형 ── */
@media(max-width:700px) {
  .metrics { grid-template-columns: 1fr 1fr; }
  .nums    { grid-template-columns: 1fr 1fr; }
  .edit-grid { grid-template-columns: 1fr 1fr; }
  .realize-grid { grid-template-columns: 1fr; }
  .grid-4,.grid-5 { grid-template-columns: 1fr 1fr; }
  .chart-stats { grid-template-columns: 1fr; }
  .modal-grid  { grid-template-columns: 1fr; }
}
@media(max-width:420px) { .metrics { grid-template-columns: 1fr; } }


/* ── 자동완성 ── */
.ac-wrap { position: relative; flex: 1; }
.ac-list {
  display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 500;
  background: var(--bg1); border: 1px solid var(--border2); border-radius: var(--radius);
  box-shadow: var(--shadow); max-height: 260px; overflow-y: auto; margin-top: 3px;
}
.ac-list.open { display: block; }
.ac-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 14px; cursor: pointer; transition: background .12s;
  border-bottom: 1px solid var(--border);
}
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.focused { background: var(--bg2); }
.ac-name { font-size: 14px; font-weight: 600; color: var(--text); }
.ac-code { font-family: var(--mono); font-size: 12px; color: var(--text3); }
</style>

<!-- 매도 모달 -->

<script>
// ════════════════════════════════════════════════════════
//  RISKBOARD v1 — 프론트엔드
//  설계: 상태(STATE) → 계산(ENGINE) → 렌더(VIEW)
//        단방향 데이터 흐름, 패치 누적 없음
// ════════════════════════════════════════════════════════

// ── 상수 ────────────────────────────────────────────────
var K = {
  BUY_FEE: 0.00015, SELL_FEE: 0.00015, TAX: 0.0018,
  STOP: 10, TAKE: 90, WARN: 5, LOOK: 42,
  SAVE_MS: 300, AUTO_MS: 5*60*1000, IDLE_MS: 15*60*1000,
  SECTORS: ['기타','반도체','2차전지','바이오/제약','금융','자동차',
            'IT/소프트웨어','철강/소재','에너지','건설','유통/소비','방산','ETF']
};

// ── 상태 ─────────────────────────────────────────────────
var ST = {
  stocks  : [],
  trades  : [],
  history : [],
  budget  : 0,
  autoOn  : false,
  notif   : false,
  _saveT  : null,
  _saveTradeT : null,
  _autoT  : null,
  _idCtr  : parseInt(localStorage.getItem('rb_idctr') || String(Date.now())),
  _searchCode: ''
};

function uid() {
  var id = ++ST._idCtr;
  // B. 카운터를 localStorage에 저장 — 새로고침 후 충돌 방지
  try { localStorage.setItem('rb_idctr', String(id)); } catch(e){}
  return id;
}

// ════════════════════════════════════════════════════════
//  계산 엔진 — 이 함수들만 가격·상태를 계산한다
// ════════════════════════════════════════════════════════

function E_avgBuy(s) {
  var b = s.batches;
  if (b && b.length > 0) {
    var cost = b.reduce(function(a,x){ return a + x.price*x.qty; }, 0);
    var qty  = b.reduce(function(a,x){ return a + x.qty; }, 0);
    return qty > 0 ? cost/qty : (s.buy||0);
  }
  return s.buy || 0;
}

function E_totalQty(s) {
  var b = s.batches;
  if (b && b.length > 0) return b.reduce(function(a,x){ return a+x.qty; }, 0);
  return s.qty || 0;
}

function E_stopPrice(s) { return E_avgBuy(s) * (1 - (s.stopPct||K.STOP)/100); }

function E_takePrice(s) {
  if (s.targetPrice > 0) return s.targetPrice;
  return s.high * ((s.takePct||K.TAKE)/100);
}

function E_takeValid(s) { return E_takePrice(s) > E_stopPrice(s); }

function E_status(s) {
  var avg  = E_avgBuy(s);
  var stop = E_stopPrice(s);
  var take = E_takePrice(s);
  var wp   = s.warnPct || K.WARN;
  var p    = avg > 0 ? (s.cur - avg) / avg * 100 : 0;
  if (s.cur <= stop)                 return { code:'danger', label:'손절 도달' };
  if (E_takeValid(s) && s.cur>=take) return { code:'take',   label:'익절 라인 도달' };
  if (p <= -wp)                      return { code:'warn',   label:'손절 주의' };
  return                                    { code:'safe',   label:'보유 유지' };
}

function E_realizeAt(exit, avg, qty) {
  var gross = (exit - avg) * qty;
  var fBuy  = avg  * qty * K.BUY_FEE;
  var fSell = exit * qty * (K.SELL_FEE + K.TAX);
  return Math.round(gross - fBuy - fSell);
}

function E_realizeAll(s) {
  var avg = E_avgBuy(s), qty = E_totalQty(s);
  return {
    atStop: E_realizeAt(E_stopPrice(s), avg, qty),
    atTake: E_realizeAt(E_takePrice(s), avg, qty),
    atCur : E_realizeAt(s.cur,          avg, qty)
  };
}

function E_holdDays(dateStr) {
  if (!dateStr) return null;
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  var diff = Math.floor((Date.now() - d.getTime()) / 86400000);
  return diff >= 0 ? diff : null;
}

// ════════════════════════════════════════════════════════
//  내장 테스트 — 페이지 로드 시 자동 실행
// ════════════════════════════════════════════════════════
function runTests() {
  var p=0, f=0;
  function eq(lb, got, exp) {
    if (Math.abs(Number(got)-Number(exp)) < 0.01 || String(got)===String(exp)) { p++; }
    else { f++; console.error('[FAIL] '+lb+': got='+got+' exp='+exp); }
  }
  var s1={buy:10000,qty:100,high:12000,cur:10000,stopPct:10,takePct:90,warnPct:5};
  eq('avgBuy 단일',     E_avgBuy(s1), 10000);
  eq('totalQty 단일',   E_totalQty(s1), 100);
  eq('stopPrice',       Math.round(E_stopPrice(s1)), 9000);
  eq('takePrice',       Math.round(E_takePrice(s1)), 10800);
  eq('takeValid true',  E_takeValid(s1), true);
  var b2={batches:[{price:10000,qty:100},{price:8000,qty:100}],high:12000,stopPct:10,takePct:90,warnPct:5};
  eq('avgBuy 분할',     E_avgBuy(b2), 9000);
  eq('totalQty 분할',   E_totalQty(b2), 200);
  eq('stopPrice 분할',  Math.round(E_stopPrice(b2)), 8100);
  function s(c,e){ return Object.assign({},s1,{cur:c},e||{}); }
  eq('danger',          E_status(s(9000)).code, 'danger');
  eq('take',            E_status(s(10800)).code,'take');
  eq('warn -5%',        E_status(s(9500)).code, 'warn');
  eq('safe',            E_status(s(9600)).code, 'safe');
  eq('targetPrice',     E_status(s(55000,{buy:50000,high:60000,targetPrice:55000})).code,'take');
  var stuck={buy:100000,qty:10,high:70000,cur:92000,stopPct:10,takePct:90,warnPct:5};
  eq('takeInvalid warn', E_status(stuck).code, 'warn');
  var r=E_realizeAll({buy:50000,qty:100,high:60000,cur:45000,stopPct:10,takePct:90,warnPct:5});
  eq('realizeAt 손절', r.atStop, -509525);
  eq('realizeAt 익절', r.atTake, 388720);
  eq('fmtPct(0)',   fmtPct(0),   '0.00%');
  eq('fmtPct(+5)',  fmtPct(5),   '+5.00%');
  eq('fmtPct(-3)',  fmtPct(-3),  '-3.00%');
  eq('esc <',       esc('<b>'),  '&lt;b&gt;');
  eq('csvF comma',  csvF('a,b').charAt(0), '"');
  if (f===0) console.log('[TEST] '+p+'개 전체 통과 ✓');
  else console.warn('[TEST] '+f+'개 실패');
}

// ════════════════════════════════════════════════════════
//  유틸
// ════════════════════════════════════════════════════════
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
function fmtPct(n) {
  var v = parseFloat(n).toFixed(2);
  return (parseFloat(v) > 0 ? '+' : '') + v + '%';
}
function fmtDate(d) { return d ? String(d).slice(0,10) : '—'; }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function csvF(v) {
  var s = String(v==null?'':v);
  return (s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0)
    ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function timeNow() {
  return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}

// ════════════════════════════════════════════════════════
//  마이그레이션 — 구버전 데이터 자동 변환
// ════════════════════════════════════════════════════════
function migrate(s) {
  var o = Object.assign({}, s);
  // takePct 구버전(1~20) → 새형식
  if (typeof o.takePct==='number' && o.takePct>0 && o.takePct<=20)
    o.takePct = 100 - o.takePct;
  if (!o.takePct)  o.takePct  = K.TAKE;
  if (!o.warnPct)  o.warnPct  = K.WARN;
  if (!o.stopPct)  o.stopPct  = K.STOP;
  if (!o.lookback) o.lookback = K.LOOK;
  if (!o.sector)   o.sector   = '기타';
  // batches 없으면 buy/qty로 생성
  if (!o.batches || o.batches.length===0) {
    o.batches = (o.buy && o.qty)
      ? [{id:uid(), price:o.buy, qty:o.qty, date:o.buydate||''}]
      : [];
  }
  return o;
}

// ════════════════════════════════════════════════════════
//  초기화
// ════════════════════════════════════════════════════════
function init() {
  tick(); setInterval(tick, 1000);
  // 알림 권한
  if ('Notification' in window) {
    if (Notification.permission==='default')
      Notification.requestPermission().then(function(p){ ST.notif=(p==='granted'); });
    else ST.notif = (Notification.permission==='granted');
  }
  // 자동갱신 복원
  if (localStorage.getItem('rb_auto')==='1') {
    ST.autoOn = true;
    var b = $('auto-badge'); b.textContent='⏱ 자동갱신 ON'; b.classList.add('on');
    scheduleAuto();
  }
  // 브라우저 종료 전 저장
  window.addEventListener('beforeunload', function() {
    clearTimeout(ST._saveT);
    if (ST.stocks.length) {
      try { navigator.sendBeacon('/api/portfolio', JSON.stringify(ST.stocks)); } catch(e){}
    }
  });
  loadAll();
  runTests();
}

async function loadAll() {
  try {
    var [pr,tr,hr] = await Promise.all([
      fetch('/api/portfolio'), fetch('/api/trades'), fetch('/api/history')
    ]);
    var raw = pr.ok ? await pr.json() : [];
    ST.trades  = tr.ok ? await tr.json() : [];
    ST.history = hr.ok ? await hr.json() : [];
    var migCnt = 0;
    ST.stocks = raw.map(function(s) {
      var m = migrate(s);
      var changed = m.takePct!==s.takePct || m.warnPct!==s.warnPct ||
                    m.stopPct!==s.stopPct || m.lookback!==s.lookback ||
                    m.sector!==s.sector   ||
                    ((!s.batches||s.batches.length===0) && m.batches&&m.batches.length>0);
      if (changed) migCnt++;
      return m;
    });
    if (migCnt>0) { save(); toast('이전 데이터 '+migCnt+'개 종목 자동 변환'); }
  } catch(e) { console.warn('[loadAll]', e); }

  ST.budget = parseInt(localStorage.getItem('rb_budget')||'0');
  var bi=$('inp-budget'); if (bi && ST.budget) bi.value=ST.budget;
  render(); renderTrades(); renderChart();
}

function save() {
  clearTimeout(ST._saveT);
  ST._saveT = setTimeout(async function() {
    try {
      var r = await fetch('/api/portfolio',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(ST.stocks)
      });
      if (!r.ok) toast('⚠ 저장 실패 (HTTP '+r.status+')', true);
    } catch(e) { toast('⚠ 저장 실패 — 서버 연결 확인', true); }
  }, K.SAVE_MS);
}

function saveTrades() {
  clearTimeout(ST._saveTradeT);
  ST._saveTradeT = setTimeout(async function() {
    try {
      var r = await fetch('/api/trades',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(ST.trades)
      });
      // C. 매도 기록 저장 실패 시 사용자에게 알림
      if (!r.ok) toast('⚠ 매도 기록 저장 실패 (HTTP '+r.status+')', true);
    } catch(e) {
      console.warn('[saveTrades]', e);
      toast('⚠ 매도 기록 저장 실패 — 서버 연결 확인', true);
    }
  }, K.SAVE_MS);
}

function marketOpen() {
  var n=new Date(), d=n.getDay(), m=n.getHours()*60+n.getMinutes();

}

function scheduleAuto() {

  ST._autoT = setTimeout(async function() {
    if (!ST.autoOn) return;
    if (marketOpen() && ST.stocks.length) await doRefreshAll(true);
    scheduleAuto();
  }, marketOpen() ? K.AUTO_MS : K.IDLE_MS);
}

var _acIdx = -1;  // 현재 선택된 항목 인덱스

function acInput(val) {
  val = val.trim();
  _acIdx = -1;
  if (!val || /^\d+$/.test(val)) { acClose(); return; }
  var upper = val.toUpperCase();
  var hits = [];
  // 앞글자 일치 우선
  Object.keys(AC_STOCKS).forEach(function(name) {
    if (name.toUpperCase().startsWith(upper)) hits.push(name);
  });
  // 포함 일치
  Object.keys(AC_STOCKS).forEach(function(name) {
    if (!name.toUpperCase().startsWith(upper) &&
        name.toUpperCase().includes(upper)) hits.push(name);
  });
  hits = hits.slice(0, 10);
  if (!hits.length) { acClose(); return; }
  var el = $('ac-list');
  el.innerHTML = hits.map(function(name, i) {
    var code = AC_STOCKS[name];
    return '<div class="ac-item" data-name="' + esc(name) +
           '" data-code="' + code + '">' +
           '<span class="ac-name">' + esc(name) + '</span>' +
           '<span class="ac-code">' + code + '</span></div>';
  }).join('');
  // 클릭 이벤트
  el.onmousedown = function(e) {
    var item = e.target.closest ? e.target.closest('.ac-item') : e.target;
    if (item && item.dataset) acPick(item.dataset.name, item.dataset.code);
  };
  el.classList.add('open');
}

function acKeyDown(e) {
  var el = $('ac-list');
  if (!el.classList.contains('open')) {
    if (e.key === 'Enter') doSearch();
    return;
  }
  var items = el.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _acIdx = Math.min(_acIdx + 1, items.length - 1);
    acHighlight(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _acIdx = Math.max(_acIdx - 1, 0);
    acHighlight(items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_acIdx >= 0 && items[_acIdx]) {
      var item = items[_acIdx];
      acPick(item.dataset.name, item.dataset.code);
    } else {
      acClose();
      doSearch();
    }
  } else if (e.key === 'Escape') {
    acClose();
  }
}

function acHighlight(items) {
  items.forEach(function(el, i) {
    el.classList.toggle('focused', i === _acIdx);
  });
  if (items[_acIdx]) items[_acIdx].scrollIntoView({block:'nearest'});
}

function acPick(name, code) {
  var el = $('f-name');
  if (el) el.value = name;
  ST._searchCode = code;
  acClose();
  // 한 프레임 뒤 검색 실행
  requestAnimationFrame ? requestAnimationFrame(doSearch) : setTimeout(doSearch, 0);
}

function acClose() {
  var el = $('ac-list');
  if (el) { el.classList.remove('open'); _acIdx = -1; }
}

async function doSearch() {
  var q = $('f-name').value.trim();
  var look = parseInt($('f-look').value)||K.LOOK;
  if (!q) { alert('종목명을 입력해 주세요'); return; }
  var btn=$('btn-search'); btn.disabled=true; btn.textContent='조회중…';
  setChip('load','시세 조회 중…');
  $('hint-box').style.display='none';
  try {
    var r = await fetch('/api/search?q='+encodeURIComponent(q)+'&lookback='+look);
    var d = await r.json();
    if (!r.ok) throw new Error(d.error||'조회 실패');
    ST._searchCode = d.code;
    $('f-name').value = d.name;
    $('f-cur').value  = d.cur;
    $('f-high').value = d.high;
    // 조회 성공한 종목을 자동완성 목록에 추가
    if (d.code && d.name) AC_STOCKS[d.name] = d.code;
    setChip('ok', esc(d.name)+'('+d.code+') · 현재가 '+fmt(d.cur)+'원 · '+look+'일고가 '+fmt(d.high)+'원');
  } catch(e) {
    setChip('err', esc(e.message));
    $('hint-box').style.display='block';
  }
  btn.disabled=false; btn.textContent='시세 조회';
}

function setChip(type, msg) {
  var cls = {ok:'chip-ok',err:'chip-err',load:'chip-load'}[type];
  var spin = type==='load' ? '<span class="spin"></span>' : '';
  $('search-chip').innerHTML = '<span class="chip '+cls+'">'+spin+msg+'</span>';
}

function addStock() {
  var name  = $('f-name').value.trim();
  var cur   = parseFloat($('f-cur').value);
  var high  = parseFloat($('f-high').value);
  var price = parseFloat($('f-buy').value);
  var qty   = parseInt($('f-qty').value);
  var stop  = parseFloat($('f-stop').value)||K.STOP;
  var take  = parseFloat($('f-take').value)||K.TAKE;
  var warn  = parseFloat($('f-warn').value)||K.WARN;
  var look  = parseInt($('f-look').value)||K.LOOK;
  var date  = $('f-date').value;
  var sect  = $('f-sector').value||'기타';
  var tgt   = parseFloat($('f-target').value)||0;
  var memo  = $('f-memo').value.trim();

  if (!name||isNaN(cur)||isNaN(high)||isNaN(price)||isNaN(qty)||
      cur<=0||high<=0||price<=0||qty<=0) {
    alert('종목명·현재가·고가·매입가·수량은 필수이며 0보다 커야 합니다'); return;
  }
  if (warn >= stop) {
    alert('손절 주의 기준('+warn+'%)은 손절 기준('+stop+'%)보다 작아야 합니다'); return;
  }
  var id = uid();
  ST.stocks.push({
    id:id, code:ST._searchCode||name, name:name,
    cur:cur, high:high,
    batches:[{id:uid(), price:price, qty:qty, date:date}],
    buy:price, qty:qty,
    stopPct:stop, takePct:take, warnPct:warn,
    lookback:look, sector:sect, targetPrice:tgt>0?tgt:0,
    memo:memo, refreshFail:false, updatedAt:timeNow()
  });
  save();
  // 폼 초기화
  ['f-name','f-cur','f-high','f-buy','f-qty','f-memo','f-target'].forEach(function(id) { $(id).value=''; });
  $('f-stop').value=K.STOP; $('f-take').value=K.TAKE; $('f-warn').value=K.WARN;
  $('f-look').value=K.LOOK; $('f-date').value=''; $('f-sector').value='기타';
  $('search-chip').innerHTML=''; $('hint-box').style.display='none';
  ST._searchCode='';
  render();
  setTimeout(function(){ var el=$('card-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); },100);
}

function addBatch(sid) {
  var s=ST.stocks.find(function(x){return x.id===sid;}); if(!s) return;
  var p=parseFloat($('bp-'+sid).value), q=parseInt($('bq-'+sid).value), d=$('bd-'+sid).value;
  if (isNaN(p)||isNaN(q)||p<=0||q<=0) { alert('매입가와 수량을 입력해 주세요'); return; }
  if (!s.batches) s.batches=[];
  s.batches.push({id:uid(), price:p, qty:q, date:d});
  s.buy=E_avgBuy(s); s.qty=E_totalQty(s);
  $('bp-'+sid).value=''; $('bq-'+sid).value=''; $('bd-'+sid).value='';
  save(); render();
}

function removeBatch(sid, bid) {

async function refreshAll() {
  if (!ST.stocks.length) return;
  var btn=$('btn-all'); btn.disabled=true; btn.textContent='갱신중…';
  await doRefreshAll(false);
  btn.disabled=false; btn.textContent='↻ 전체 갱신';
}

async function doRefreshAll(silent) {
  var snap=ST.stocks.slice();
  var prev={}; snap.forEach(function(s){ prev[s.id]=E_status(s).code; });
  if (!silent) { var b=$('btn-all'); if(b) b.textContent='갱신중… ('+snap.length+'개)'; }

  var items=snap.map(function(s) {
    return { id:s.id,
             code:/^\d{6}$/.test(s.code)?s.code:s.name,
             name:s.name, lookback:s.lookback||K.LOOK };
  });

  var scrollY=window.scrollY;
  try {
    var r=await fetch('/api/refresh',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(items)
    });
    if (r.ok) {
      var res=await r.json();
      snap.forEach(function(s) {
        var d=res[String(s.id)];
        var ex=ST.stocks.find(function(x){return x.id===s.id;});
        if (!ex) return;
        if (!d||d.error) { ex.refreshFail=true; return; }
        ex.cur=d.cur;
        if (d.high&&d.high>ex.high) ex.high=d.high;
        ex.refreshFail=false; ex.updatedAt=timeNow();
      });
      save();
    }
  } catch(e) {
    if (!silent) toast('⚠ 갱신 실패. 네트워크를 확인해 주세요.', true);
  }

  render(); window.scrollTo(0, scrollY);

  // 상태 변화 알림
  ST.stocks.forEach(function(s) {
    var nc=E_status(s).code;
    if (prev[s.id]!=='danger'&&nc==='danger')
      notify('🔴 손절 도달: '+s.name,
             '현재가 '+fmt(s.cur)+'원 / 손절라인 '+fmt(Math.round(E_stopPrice(s)))+'원');
    if (prev[s.id]!=='take'&&nc==='take')
      notify('🔵 익절 라인 도달: '+s.name, fmt(s.cur)+'원. 수익 실현을 고려하세요.');
  });
}

async function refreshOne(id) {
  var s=ST.stocks.find(function(x){return x.id===id;}); if(!s) return;
  var prev=E_status(s).code;
  var btn=$('rbtn-'+id); if(btn){btn.textContent='…';btn.disabled=true;}
  try {
    var r=await fetch('/api/refresh',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify([{id:s.id,code:/^\d{6}$/.test(s.code)?s.code:s.name,name:s.name,lookback:s.lookback||K.LOOK}])
    });
    if (r.ok) {
      var res=await r.json();
      var d=res[String(s.id)];
      if (d&&!d.error) {
        s.cur=d.cur; if(d.high&&d.high>s.high) s.high=d.high;
        s.refreshFail=false; s.updatedAt=timeNow();
      } else { s.refreshFail=true; }
    } else { s.refreshFail=true; }
    save();
  } catch(e) { s.refreshFail=true; save(); }
  render();
  var nc=E_status(s).code;
  if (prev!=='danger'&&nc==='danger') notify('🔴 손절 도달: '+s.name,'손절라인에 도달했습니다.');
  if (prev!=='take'&&nc==='take')     notify('🔵 익절 라인 도달: '+s.name,'수익 실현을 고려하세요.');
}

// ════════════════════════════════════════════════════════
//  매도 처리
// ════════════════════════════════════════════════════════
function openSell(id) {
  var s=ST.stocks.find(function(x){return x.id===id;}); if(!s) return;
  var avg=E_avgBuy(s), qty=E_totalQty(s);
  $('sell-id').value=id;
  $('sell-name').textContent=esc(s.name);
  $('sell-avg-disp').textContent=fmt(Math.round(avg))+'원';
  $('sell-qty-disp').textContent=qty;
  $('sell-price').value=s.cur||'';
  $('sell-qty').value=qty;
  $('sell-date').value=new Date().toISOString().slice(0,10);
  $('sell-note').value='';
  previewSell();
  $('sell-bg').classList.add('open');
}

function closeSell() { $('sell-bg').classList.remove('open'); }

function previewSell() {
  var id=parseInt($('sell-id').value);
  var s=ST.stocks.find(function(x){return x.id===id;}); if(!s) return;
  var price=parseFloat($('sell-price').value)||0;
  var qty=parseInt($('sell-qty').value)||0;
  if (price>0&&qty>0) {
    var avg=E_avgBuy(s);
    var net=E_realizeAt(price,avg,qty);
    var pct=avg>0?(price-avg)/avg*100:0;
    $('sell-preview').innerHTML=
      '예상 실현손익: <strong style="color:'+(net>=0?'var(--green)':'var(--red)')+'">'+
      (net>=0?'+':'')+fmt(net)+'원</strong> ('+fmtPct(pct)+')'+
      '<br><small style="color:var(--text3)">거래세 0.18% · 수수료 각 0.015% 반영</small>';
  } else { $('sell-preview').innerHTML=''; }
}

function confirmSell() {
  var id=parseInt($('sell-id').value);
  var s=ST.stocks.find(function(x){return x.id===id;}); if(!s) return;
  var price=parseFloat($('sell-price').value);
  var qty=parseInt($('sell-qty').value);
  var date=$('sell-date').value;
  var note=$('sell-note').value.trim();
  if (isNaN(price)||isNaN(qty)||price<=0||qty<=0) { alert('올바른 매도가와 수량을 입력해 주세요'); return; }
  var totalQ=E_totalQty(s);
  if (qty>totalQ) { alert('보유 수량('+totalQ+'주)보다 많이 매도할 수 없습니다'); return; }
  var avg=E_avgBuy(s);
  var net=E_realizeAt(price,avg,qty);
  var pct=avg>0?parseFloat(((price-avg)/avg*100).toFixed(2)):0;
  var first=s.batches&&s.batches[0]?s.batches[0].date:'';

  ST.trades.unshift({
    id:uid(), stockId:id, code:s.code, name:s.name,
    sellPrice:price, sellQty:qty, avgBuy:Math.round(avg),
    sellDate:date, realizeNet:net, realizePct:pct,
    holdDays:E_holdDays(first), note:note
  });
  saveTrades();

  var remaining=totalQ-qty;
  if (remaining<=0) {
    ST.stocks=ST.stocks.filter(function(x){return x.id!==id;});
    toast('✅ '+esc(s.name)+' 전량 매도 완료');
  } else {
    // batches 없는 경우 방어
    if (!s.batches||s.batches.length===0) {
      s.qty=remaining;
    } else {
      var toRemove=qty;
      for (var i=s.batches.length-1;i>=0&&toRemove>0;i--) {
        var b=s.batches[i];
        if (b.qty<=toRemove) { toRemove-=b.qty; s.batches.splice(i,1); }
        else { b.qty-=toRemove; toRemove=0; }
      }
      s.qty=E_totalQty(s); s.buy=E_avgBuy(s);
    }
    toast('✅ '+qty+'주 매도 완료. '+remaining+'주 남음.');
  }
  save(); closeSell(); render(); renderTrades();
}

// ════════════════════════════════════════════════════════
//  알림 / 토스트

function notify(title, body) {
  if (ST.notif) { try { new Notification(title,{body:body}); } catch(e){} }
  toast('🔔 '+title+'\n'+body, true);
}

function toast(msg, isErr) {
  var t=document.createElement('div');
  t.className='toast'+(isErr?' err':''); t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){
    t.style.animation='toastOut .25s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },250);
  }, isErr?6000:3000);
}

function exportCSV() {
  if (!ST.stocks.length) { alert('종목이 없습니다'); return; }
  var tb=ST.stocks.reduce(function(a,s){return a+E_avgBuy(s)*E_totalQty(s);},0);
  var hdr='종목명,코드,섹터,평균매입가,수량,현재가,기준고가,손절%,익절선%,주의%,매입금액,평가금액,평가손익,수익률%,손절가,익절가,비중%,메모\n';
  var rows=ST.stocks.map(function(s){
    var avg=Math.round(E_avgBuy(s)), qty=E_totalQty(s);
    var stop=Math.round(E_stopPrice(s)), take=Math.round(E_takePrice(s));
    var pnl=(s.cur-avg)*qty, pct=avg>0?((s.cur-avg)/avg*100).toFixed(2):0;
    var w=tb>0?((avg*qty/tb)*100).toFixed(1):'';
    return [s.name,s.code,s.sector||'기타',avg,qty,s.cur,s.high,
            s.stopPct||K.STOP,s.takePct||K.TAKE,s.warnPct||K.WARN,
            avg*qty,s.cur*qty,pnl,pct,stop,take,w,s.memo||''].map(csvF).join(',');
  }).join('\n');
  dlCSV('portfolio_'+new Date().toISOString().slice(0,10)+'.csv', hdr+rows);
}

function exportTradesCSV() {
  if (!ST.trades.length) { alert('매도 기록이 없습니다'); return; }
  var hdr='종목명,코드,매도일,평균매입가,매도가,수량,실현손익,수익률%,보유일수,메모\n';
  var rows=ST.trades.map(function(t){
    return [t.name,t.code,fmtDate(t.sellDate),t.avgBuy,t.sellPrice,t.sellQty,
            t.realizeNet,t.realizePct,t.holdDays!=null?t.holdDays:'—',t.note||''].map(csvF).join(',');
  }).join('\n');
  dlCSV('trades_'+new Date().toISOString().slice(0,10)+'.csv', hdr+rows);
}

function dlCSV(name, content) {
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8'}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

// ════════════════════════════════════════════════════════
//  정렬 — 원본 오염 없음 (Object.assign 복사)
// ════════════════════════════════════════════════════════
function sorted() {
  var key=$('sort-sel').value;
  var tb=ST.stocks.reduce(function(a,s){return a+E_avgBuy(s)*E_totalQty(s);},0);
  var arr=ST.stocks.map(function(s) {
    var c=Object.assign({},s);
    var avg=E_avgBuy(s), qty=E_totalQty(s);
    c._pp=avg>0?(s.cur-avg)/avg*100:0;
    c._ds=s.cur>0?(s.cur-E_stopPrice(s))/s.cur*100:0;
    c._w =tb>0?avg*qty/tb*100:0;
    var fd=s.batches&&s.batches[0]?s.batches[0].date:'';
    var hd=E_holdDays(fd); c._hd=hd!=null?hd:-1;
    return c;
  });
  if (key==='pnl')    arr.sort(function(a,b){return b._pp-a._pp;});
  if (key==='stop')   arr.sort(function(a,b){return a._ds-b._ds;});
  if (key==='weight') arr.sort(function(a,b){return b._w -a._w; });
  if (key==='days')   arr.sort(function(a,b){return b._hd-a._hd;});
  if (key==='sector') arr.sort(function(a,b){return (a.sector||'').localeCompare(b.sector||'');});
  return arr;
}

//  렌더 — 표시만 담당 (계산은 E_* 함수 사용)

var ST_CSS={

    var avg    = E_avgBuy(s);

    if(st.code==='danger'||st.code==='warn') warnCnt++;

    var w      = tb>0?((avg*qty/tb)*100).toFixed(1):'—';

    var takeC  = s.cur>=take&&takeOk?'var(--green)':!takeOk?'var(--red)':'var(--text3)';

    var hasTgt = s.targetPrice>0;

    html+='<div class="card" id="card-'+s.id+'" style="animation-delay:'+delay+'s">';
    html+='<div class="card-stripe '+css.stripe+'"></div>';

    // 프로그레스 바
    html+='<div class="prog"><div class="prog-bg"><div class="prog-fill" style="width:'+barW+'%;background:'+barC+'"></div></div>';
    html+='<div class="prog-lbls"><span class="prog-lbl">손절 '+fmt(Math.round(stop))+'원</span><span class="prog-lbl">현재 '+fmt(s.cur)+'원</span><span class="prog-lbl">평균 '+fmt(Math.round(avg))+'원</span></div></div>';
    html+='</div></div>';
  });

  el.innerHTML=html;

  // 요약 메트릭
  var tpnl=tCur-tBuy, tpct=tBuy>0?(tpnl/tBuy*100).toFixed(2):0;
  $('m-count').textContent=ST.stocks.length+' 종목';
  $('m-buy').textContent=fmt(tBuy)+'원';
  $('m-cur').textContent=fmt(tCur)+'원';
  var pe=$('m-pnl');
  pe.textContent=(tpnl>=0?'+':'')+fmt(tpnl)+'원';
  pe.style.color=tpnl>0?'var(--green)':tpnl<0?'var(--red)':'';
  var pp=$('m-pnl-pct');
  pp.textContent=fmtPct(tpct);
  pp.style.color=tpnl>0?'var(--green)':tpnl<0?'var(--red)':'';
  var sw=$('m-warn');
  sw.textContent=warnCnt+' 종목';
  sw.style.color=warnCnt>0?'var(--red)':'';
  $('m-warn-box').style.borderColor=warnCnt>0?'rgba(248,81,73,.3)':'';

  // 알림 박스
  $('alerts').innerHTML=alertList.map(function(s){
    var st=E_status(s), isD=st.code==='danger';
    return '<div class="alert '+(isD?'alert-danger':'alert-take')+'">'+
      (isD?'🔴':'🔵')+' <strong>'+esc(s.name)+'</strong> — '+st.label+'. 매매 규칙을 확인하세요.</div>';
  }).join('');

  renderBudget(tBuy);
  renderSectors(tBuy);
}

function num(label, valHtml, sub, valCls, subColor) {
  var vc=valCls?' '+valCls:'';
  var sc=sub?'<div class="num-sub"'+(subColor?' style="color:'+subColor+'"':'')+'>'+sub+'</div>':'';
  return '<div class="num"><div class="num-label">'+label+'</div><div class="num-val'+vc+'">'+valHtml+'</div>'+sc+'</div>';
}

function renderBudget(tBuy) {
  var u=$('b-used'), c=$('b-cash'), cp=$('b-cashpct'), f=$('budget-fill');
  if (!ST.budget) { u.textContent='한도 미설정'; c.textContent='—'; cp.textContent='—'; f.style.width='0%'; return; }
  var cash=Math.max(0,ST.budget-tBuy);
  var up=Math.min(100,tBuy/ST.budget*100).toFixed(1);
  u.textContent=fmt(tBuy)+'원 ('+up+'%)';
  c.textContent=fmt(cash)+'원';
  cp.textContent=(cash/ST.budget*100).toFixed(1)+'%';
  f.style.width=up+'%';
  f.style.background=up>90?'var(--red)':up>70?'var(--amber)':'var(--blue)';
}

function renderSectors(tBuy) {
  var el=$('sector-chips'); if(!el||!ST.stocks.length){if(el)el.innerHTML='';return;}
  var map={};
  ST.stocks.forEach(function(s){
    var sec=s.sector||'기타';
    var val=E_avgBuy(s)*E_totalQty(s);
    if(!map[sec]) map[sec]={buy:0,cur:0};
    map[sec].buy+=val; map[sec].cur+=s.cur*E_totalQty(s);
  });
  var html='';
  Object.keys(map).sort().forEach(function(sec){
    var m=map[sec];
    var pct=tBuy>0?(m.buy/tBuy*100).toFixed(1):0;
    var pnl=m.cur-m.buy;
    html+='<div class="sector-chip">';
    html+='<span class="sc-name">'+esc(sec)+'</span>';
    html+='<span class="sc-pct">'+pct+'%</span>';
    html+='<span class="sc-pnl" style="color:'+(pnl>=0?'var(--green)':'var(--red)')+'">'+
          (pnl>=0?'+':'')+fmt(pnl)+'원</span>';
    html+='</div>';
  });
  el.innerHTML=html;
}

// ════════════════════════════════════════════════════════
//  매도 기록 탭
// ════════════════════════════════════════════════════════
function renderTrades() {
  var el=$('trade-list'), su=$('trade-summary'); if(!el) return;
  if (!ST.trades.length) {
    el.innerHTML='<div class="empty"><div class="empty-icon">📋</div><div class="empty-txt">매도 기록이 없습니다</div></div>';
    su.innerHTML=''; return;
  }
  var tNet=ST.trades.reduce(function(a,t){return a+t.realizeNet;},0);
  var tCost=ST.trades.reduce(function(a,t){return a+t.avgBuy*t.sellQty;},0);
  var aPct=tCost>0?(tNet/tCost*100).toFixed(2):0;
  su.innerHTML='<div class="trade-summary"><span>총 실현손익</span>'+
    '<strong style="color:'+(tNet>=0?'var(--green)':'var(--red)')+'">'+
    (tNet>=0?'+':'')+fmt(tNet)+'원 ('+fmtPct(aPct)+')</strong>'+
    '<span>'+ST.trades.length+'건</span></div>';
  var html='';
  ST.trades.forEach(function(t){
    var g=t.realizeNet>=0;
    html+='<div class="trade-card">';
    html+='<div class="trade-hdr"><div>';
    html+='<div class="trade-name">'+esc(t.name)+'</div>';
    html+='<div class="trade-meta">'+esc(t.code)+' · 매도 '+fmtDate(t.sellDate)+
          (t.holdDays!=null?' · 보유 '+t.holdDays+'일':'')+'</div></div>';
    html+='<div class="trade-pnl" style="color:'+(g?'var(--green)':'var(--red)')+'">'+
          (g?'+':'')+fmt(t.realizeNet)+'원<br><small>'+fmtPct(t.realizePct)+'</small></div>';
    html+='</div>';
    html+='<div class="trade-detail">';
    html+='<span>평균매입 '+fmt(t.avgBuy)+'원</span>';
    html+='<span>매도 '+fmt(t.sellPrice)+'원</span>';
    html+='<span>'+t.sellQty+'주</span>';
    if(t.note) html+='<span class="trade-note">'+esc(t.note)+'</span>';
    html+='</div></div>';
  });
  el.innerHTML=html;
}

// ════════════════════════════════════════════════════════
//  수익률 차트 탭 (SVG)
// ════════════════════════════════════════════════════════
function renderChart() {
  var el=$('chart-area'); if(!el) return;
  if (!ST.history.length) {
    el.innerHTML='<div class="empty"><div class="empty-icon">📈</div><div class="empty-txt">종목을 저장하면 매일 수익률이 기록됩니다</div></div>';
    return;
  }
  var data=ST.history.slice(-90);
  if (data.length===1) data=[data[0],data[0]];
  var W=680,H=240,PL=58,PR=18,PT=16,PB=36;
  var cW=W-PL-PR, cH=H-PT-PB;
  var pcts=data.map(function(d){return d.pnlPct;});
  var minV=Math.min.apply(null,pcts), maxV=Math.max.apply(null,pcts);
  var rng=maxV-minV||1, pad=rng*.12; minV-=pad; maxV+=pad; rng=maxV-minV;
  function xp(i){ return PL+i/Math.max(data.length-1,1)*cW; }
  function yp(v){ return PT+(1-(v-minV)/rng)*cH; }
  var pts=data.map(function(d,i){return xp(i)+','+yp(d.pnlPct);});
  var pathD='M '+pts.join(' L ');
  var zY=yp(0), zIn=zY>=PT&&zY<=PT+cH;
  var xLbls='', step=Math.max(1,Math.floor(data.length/6));
  for(var i=0;i<data.length;i+=step) {
    xLbls+='<text x="'+xp(i)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9" fill="#4a5568">'+data[i].date.slice(5)+'</text>';
  }
  var yLbls='';
  for(var j=0;j<=5;j++){
    var v=minV+(rng/5)*j, ly=yp(v);
    yLbls+='<line x1="'+PL+'" y1="'+ly+'" x2="'+(W-PR)+'" y2="'+ly+'" stroke="#1e2d3d" stroke-width=".5"/>';
    yLbls+='<text x="'+(PL-4)+'" y="'+(ly+4)+'" text-anchor="end" font-size="9" fill="#4a5568">'+v.toFixed(1)+'%</text>';
  }
  var last=data[data.length-1], lx=xp(data.length-1), ly2=yp(last.pnlPct);
  var dotC=last.pnlPct>=0?'#3fb950':'#f85149';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:'+W+'px">';
  svg+=yLbls;
  if(zIn) {
    svg+='<line x1="'+PL+'" y1="'+zY+'" x2="'+(W-PR)+'" y2="'+zY+'" stroke="#2a3f55" stroke-width="1" stroke-dasharray="4,3"/>';
    svg+='<text x="'+(PL-4)+'" y="'+(zY+4)+'" text-anchor="end" font-size="9" fill="#4a5568">0%</text>';
  }
  svg+='<path d="'+pathD+'" fill="none" stroke="'+dotC+'" stroke-width="2"/>';
  svg+='<circle cx="'+lx+'" cy="'+ly2+'" r="4" fill="'+dotC+'"/>';
  svg+='<text x="'+(lx+6)+'" y="'+(ly2+4)+'" font-size="10" fill="'+dotC+'">'+fmtPct(last.pnlPct)+'</text>';
  svg+=xLbls+'</svg>';

  var tNet=ST.trades.reduce(function(a,t){return a+t.realizeNet;},0);
  el.innerHTML='<div class="chart-box">'+svg+'</div>'+
    '<div class="chart-stats">'+
    '<div class="cstat"><div class="cstat-lbl">현재 평가손익</div><div class="cstat-val" style="color:'+dotC+'">'+fmtPct(last.pnlPct)+'</div></div>'+
    '<div class="cstat"><div class="cstat-lbl">누적 실현손익</div><div class="cstat-val" style="color:'+(tNet>=0?'var(--green)':'var(--red)')+'">'+(tNet>=0?'+':'')+fmt(tNet)+'원</div></div>'+
    '<div class="cstat"><div class="cstat-lbl">기록 기간</div><div class="cstat-val">'+data.length+'일</div></div>'+
    '</div>';
}

init();

</script>

</html>
